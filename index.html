<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="/css/style.css">
    <title>Formulario</title>
</head>

<body>
    <div class="container-sm p-3 mb-2 bg-body-tertiary rounded">
        <form>
            <fieldset>

                <legend>Identificação do participante <input type="image" src="/img/enviar.jpg" alt="Submit" width="48"
                        height="48"></legend>
                <div class="row g-3 p-1 align-items-center">
                    <div class="col-auto">
                        <label for="exampleFormControlInput0" class="col-form-label">Nome</label>
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="exampleFormControlInput0"
                            placeholder="Digite seu nome" required>
                    </div>
                    <div class="col-auto">
                        <label for="exampleFormControlInput2" class="col-form-label">Email</label>
                    </div>
                    <div class="col">
                        <input type="email" class="form-control" id="exampleFormControlInput2"
                            placeholder="Digite seu email" required>
                    </div>
                    <div class="col-auto">
                        <label for="exampleFormControlInput3" class="col-form-label">Telefone</label>
                    </div>
                    <div class="col">
                        <input type="tel" class="form-control" id="exampleFormControlInput3"
                            placeholder="Digite seu telefone" maxlength="16" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Descreva o motivo do formulario</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" required></textarea>
                </div>

                <div class="row g-4 align-items-center ">
                    <div class="col-auto">
                        <label for="inputPassword6" class="col-form-label">Senha</label>
                    </div>
                    <div class="col">
                        <input type="password" id="inputPassword6" class="form-control"
                            aria-describedby="passwordHelpInline" minlength="8" maxlength="16" required
                            placeholder="Não escreva sua senha real">
                    </div>
                    <div class="col-auto">
                        <label for="inputage6" class="col-form-label">Idade</label>
                    </div>
                    <div class="col">
                        <input type="number" id="inputage6" class="form-control" aria-describedby="passwordHelpInline"
                            required placeholder="Digite sua idade" minlength="0" maxlength="120">
                    </div>

                    <div class="col">
                        <div class="col">
                            <span id="passwordHelpInline" class="form-text">
                                Anexar arquivo para identificação
                            </span>
                            <input class="form-control" type="file" id="formFile" required>
                        </div>
                    </div>
                    <div class="col">
                        <select class="form-select" aria-label="Default select example" required>
                            <option selected>Cursos</option>
                            <option value="1">ADS</option>
                            <option value="2">GTI</option>
                            <option value="3">ADS-AMS</option>
                            <option value="4">Ds</option>
                        </select>
                    </div>
                    <input type="hidden" id="custId" name="custId" value="676920">
                    <div class="col">
                        <input type="radio" id="radio1" name="fav_language" value="Homen">
                        <label for="radio1">Homen</label><br>
                        <input type="radio" id="radio2" name="fav_language" value="Mulher">
                        <label for="radio2">Mulher</label><br>
                        <input type="radio" id="radio3" name="fav_language" value="Outro">
                        <label for="radio3">Outro</label>
                        <input type="radio" id="radio4" name="fav_language" value="NPD">
                        <label for="radio4">NPD</label>
                    </div>
                </div>
                <legend>Quando foi feito o formulario</legend>
                <div class="row g-3 p-1 align-items-center">
                    <div class="col-auto">
                        <label for="inputPassword6" class="col-form-label">Hora</label>
                    </div>
                    <div class="col">
                        <input type="time" id="inputtime" class="form-control" aria-describedby="passwordHelpInline"
                            required>
                    </div>
                    <div class="col-auto">
                        <label for="inputPassword6" class="col-form-label">Data e Hora</label>
                    </div>
                    <div class="col">
                        <input type="datetime-local" id="inputdatetime" class="form-control"
                            aria-describedby="passwordHelpInline" required>
                    </div>
                </div>
            </fieldset>
            <fieldset>
                <legend>Dados de contato</legend>

                <div class="row g-3 p-1 align-items-center">
                    <div class="col-auto">
                        <label for="exampleFormControlInput0" class="col-form-label">GitHub</label>
                    </div>
                    <div class="col">
                        <input type="url" class="form-control" id="exampleFormControlInput0"
                            placeholder="Digite seu GitHub" required>
                    </div>
                    <div class="col-auto">
                        <label for="exampleFormControlInput2" class="col-form-label">LinkedIn</label>
                    </div>
                    <div class="col">
                        <input type="url" class="form-control" id="exampleFormControlInput2"
                            placeholder="Digite seu LinkedIn">
                    </div>
                    <div class="col-auto">
                        <label for="exampleFormControlInput3" class="col-form-label">Instagram</label>
                    </div>
                    <div class="col">
                        <input type="url" class="form-control" id="exampleFormControlInput3"
                            placeholder="Digite seu Instagram">
                    </div>
                </div>
            </fieldset>
            <fieldset>

                <legend>Formação e experiências</legend>

                <div class="row g-3 p-1 align-items-center">
                    <div class="col-auto">
                        <label for="exampleFormControlInput0" class="col-form-label">Ensino Medio</label>
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="exampleFormControlInput0"
                            placeholder="Digite sua escola " required>
                    </div>
                    <div class="col-auto">
                        <label for="exampleFormControlInput2" class="col-form-label">Superior</label>
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="exampleFormControlInput2"
                            placeholder="Digite sua universidade">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Descreva sua experiência
                            profissional</label>
                        <textarea class="form-control" id="exampleFormControlTextarea2" rows="5" required></textarea>
                    </div>
                </div>
            </fieldset>
            <fieldset>
                <legend>Datas e disponibilidades</legend>

                <div class="row g-3 p-1 align-items-center">
                    <div class="col-auto">
                        <label for="inputPassword6" class="col-form-label">Quando podera trabalhar?</label>
                    </div>
                    <div class="col">
                        <input type="date" id="inputdate" class="form-control" aria-describedby="passwordHelpInline"
                            required>
                    </div>
                    <div class="col-auto">
                        <label for="inputPassword6" class="col-form-label">Mês que podera trabalhar</label>
                    </div>
                    <div class="col">
                        <input type="month" id="inputmonth" class="form-control" aria-describedby="passwordHelpInline"
                            required>
                    </div>
                    <div class="col-auto">
                        <label for="inputPassword6" class="col-form-label">Qual semana?</label>
                    </div>
                    <div class="col">
                        <input type="week" id="inputweek" class="form-control" aria-describedby="passwordHelpInline"
                            required>
                    </div>

                </div>
                <div class="row g-3 p-1 align-items-center">
                    <div class="col-auto">
                        <label for="inputPassword6" class="col-form-label">Dia - Mes - Ano e Hora do seu
                            nascimento</label>
                    </div>
                    <div class="col">
                        <input type="datetime-local" id="inputdatetime" class="form-control"
                            aria-describedby="passwordHelpInline" required>
                    </div>
                </div>
            </fieldset>
            <fieldset>
                <legend>Preferencias</legend>
                <div class="row g-1 p-1 align-items-center">
                    <div class="col-auto">
                        <label for="inputPassword6" class="col-form-label">Qual sua cor preferida?</label>
                    </div>
                    <div class="col">
                        <input type="color" id="inputcolor" class="form-control" aria-describedby="passwordHelpInline"
                            required>
                    </div>
                    <div class="col-auto">
                        <label for="inputPassword6" class="col-form-label">Qual lado prefere?</label>
                    </div>
                    <div class="col">
                        <input type="range" id="inputcolor" class="form-control" aria-describedby="passwordHelpInline"
                            required>
                    </div>
                    <div class="col g-1 p-1">

                        <label for=""> Cachorro <input type="checkbox" id="cachorro" class="form-check-input"> </label>
                        <label for=""> Gato <input type="checkbox" id="Gato" class="form-check-input"> </label>
                        <label for=""> Peixe <input type="checkbox" id="Peixe" class="form-check-input"> </label>
                        <label for=""> Outro <input type="checkbox" id="Outro" class="form-check-input"></label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Informações sobre o projeto</legend>

                <div class="row g-1 p-1 align-items-center">
                    <div class="col">
                        <label for="tprojeto">Qual o tipo do projeto?</label>
                        <input type="search" list="tprojeto" name="tprojeto" class="form-control" id="tprojeto1">
                        <datalist id="tprojeto">
                            <option value="Ambiental"></option>
                            <option value="Pessoal"></option>
                            <option value="Tecnologico"></option>
                            <option value="Cientifico"></option>
                            <option value="Musical"></option>
                        </datalist>
                    </div>
                    <div class="col">
                        <div class="col">
                            <span id="passwordHelpInline" class="form-text">
                                Anexa um pdf para revisão do projeto
                            </span>
                            <input class="form-control" type="file" id="formFile2" accept=".pdf" required>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Descreva o projeto</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="5" required></textarea>
                </div>
            </fieldset>
            <fieldset>
                <legend>Botões de ação</legend>

                <div class="row g-1 align-items-center">
                    <div class="col">
                           <button type="submit" class="btn btn-warning mb-3">Nova tentativa</button>
                    </div>
                    <div class="col">
                        <input type="submit" name="submitextra" id="subextra" class="btn btn-primary mb-3">
                    </div>
                    <div class="col">
                        <input type="reset" name="resettextra" id="resetxtra" class="btn btn-danger mb-3">
                    </div>
                </div>
            
            </fieldset>
    </div>
    </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
